@if (!mediaDb.ready()) {
  <div class="flex justify-center py-24"><span class="loading loading-spinner loading-lg"></span></div>
} @else {
  <div class="flex flex-col gap-8 pb-16">
    <s3-detail-hero
      [title]="albumName() || ('music.unknownAlbum' | t)"
      [poster]="cover()"
      [chips]="chips()"
      [square]="true"
      [backLink]="['/library', directoryId(), 'artist', artistName()]"
      [backLabel]="artistName()"
    >
      @if (tracks().length) {
        <button type="button" class="s3-btn s3-btn-primary" (click)="playAlbum()"><s3-icon name="play" [size]="18" />{{ 'action.play' | t }}</button>
        <button type="button" class="s3-btn s3-btn-glass" (click)="playAlbum(true)"><s3-icon name="shuffle" [size]="18" [stroke]="2" />{{ 'action.shuffle' | t }}</button>
        @if (auth.canDownload()) {
          <button type="button" class="s3-btn s3-btn-glass" [disabled]="downloadProgress() !== null" (click)="downloadAlbum()">
            @if (downloadProgress() !== null) {
              <span class="loading loading-spinner loading-sm"></span>{{ 'download.preparing' | t: { pct: downloadProgress()! } }}
            } @else {
              <s3-icon name="download" [size]="18" [stroke]="2" />{{ 'action.downloadAlbum' | t }}
            }
          </button>
        }
      }
    </s3-detail-hero>

    @if (downloadError()) {
      <p role="alert" class="s3-warning mx-[var(--s3-gutter)] max-w-[960px] text-sm">{{ 'download.failed' | t }}</p>
    }

    @if (tracks().length === 0) {
      <p class="px-[var(--s3-gutter)] text-[var(--s3-text-muted)]">{{ 'section.empty' | t }}</p>
    } @else {
      <ol class="mx-[var(--s3-gutter)] flex max-w-[960px] flex-col s3-surface p-2" role="list">
        @for (item of tracks(); track item.id) {
          <li>
            <button type="button" class="s3-track group" (click)="play(item)">
              <span class="w-7 text-right text-sm text-[var(--s3-text-muted)] tabular-nums group-hover:hidden">{{ $index + 1 }}</span>
              <span class="hidden w-7 justify-end text-primary group-hover:flex"><s3-icon name="play" [size]="16" /></span>
              <span class="min-w-0 flex-1 truncate font-medium">{{ item.title }}</span>
              @if (isPlayed(item)) {
                <span class="text-primary" role="img" [attr.aria-label]="'music.played' | t"><s3-icon name="check" [size]="16" [stroke]="2.6" /></span>
              }
              @if (duration(item); as d) {
                <span class="text-sm text-[var(--s3-text-muted)] tabular-nums">{{ d }}</span>
              }
            </button>
          </li>
        }
      </ol>
    }
  </div>
}
